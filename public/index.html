<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #333;
            margin: 20px;
            background-color: #fff;
        }
        .game-info {
            font-size: 24px;
            margin: 10px;
        }
        .controls {
            margin: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>俄罗斯方块</h1>
    <div class="game-info">
        分数: <span id="score">0</span>
    </div>
    <canvas id="gameCanvas" width="300" height="600"></canvas>
    <div class="controls">
        <p>控制方式：</p>
        <p>← →：左右移动</p>
        <p>↑：旋转</p>
        <p>↓：加速下落</p>
        <p>空格：直接下落</p>
    </div>
    <script src="game.js"></script>
</body>
</html>
